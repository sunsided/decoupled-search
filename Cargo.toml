[package]
name = "decoupled-search"
description = "Decoupled (star-topology) search for factored SAS+ planning: star factorings, cost-optimal and greedy search, dominance pruning and decoupled heuristics"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/decoupled-search"
homepage = "https://sunsided.github.io/planning-and-search/crates/decoupled-search/"
readme = "README.md"
keywords = ["planning", "decoupled-search", "star-topology", "factored-planning", "astar"]
categories = ["algorithms", "artificial-intelligence", "science", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[dependencies]
sas-plus = { version = "0.2.1", default-features = false }
merge-and-shrink = { version = "0.3.0", optional = true }
# LmCut (see docs/design.md).
planning-heuristics = { version = "0.2", optional = true }
# BDDs for symbolic leaves; needs std and sets the MSRV.
symbolic-search = { version = "0.1", optional = true }

[features]
## A merge-and-shrink heuristic on decoupled states (`MasHeuristic`).
merge-and-shrink = ["dep:merge-and-shrink"]
## The landmark-cut heuristic on decoupled states (`LmCutHeuristic`).
lm-cut = ["dep:planning-heuristics"]
## Leaf pricing functions as BDDs (`Config::symbolic_leaves`). Needs `std`.
symbolic-leaves = ["dep:symbolic-search"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }

[[bench]]
name = "search"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

# The cross-checks run thousands of searches; unoptimised they take minutes.
[profile.test]
opt-level = 1
