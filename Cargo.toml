[package]
name = "decoupled-search"
description = "Decoupled search for factored SAS+ planning: center and leaf factoring, leaf reachability and leaf-state dominance"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/decoupled-search"
readme = "README.md"
keywords = ["planning", "sas", "decoupled-search", "factored", "search"]
categories = ["algorithms", "science", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

# Released sibling crates come from crates.io; local development patches them to the sibling
# working trees through the planning hub's .cargo/config.toml (see CONTRIBUTING.md).
[dependencies]
sas-plus = { version = "0.2.1", default-features = false }
merge-and-shrink = { version = "0.3.0", optional = true }
# Unreleased (0.0.0 placeholder on crates.io): LmCut (see docs/design.md). Cargo needs the
# sibling checkout at ../planning-heuristics until it has a release.
planning-heuristics = { version = "0.0.0", path = "../planning-heuristics", optional = true }

[features]
## A merge-and-shrink heuristic on decoupled states (`MasHeuristic`).
merge-and-shrink = ["dep:merge-and-shrink"]
## The landmark-cut heuristic on decoupled states (`LmCutHeuristic`).
lm-cut = ["dep:planning-heuristics"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }

[[bench]]
name = "search"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

# The cross-checks run thousands of searches; unoptimised they take minutes.
[profile.test]
opt-level = 1
